[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hemlock"
version = "0.2.0"
description = "Safe two-node prefix blocking controller for GoBGP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "deploy/patches/LICENSE.GoBGP"]
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.135.1",
  "starlette==0.52.1",
  "pydantic==2.12.5",
  "uvicorn==0.42.0",
  "argon2-cffi==25.1.0",
  "grpcio==1.78.0",
  "protobuf==6.33.5",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]
integration = ["playwright==1.64.0", "pexpect==4.9.0", "grpcio-tools==1.78.0"]

[project.scripts]
hemlock = "hemlock.cli:main"
hemloc = "hemlock.cli:main"

[tool.setuptools.packages.find]
include = ["hemlock*", "hemloc"]

[tool.setuptools.package-data]
hemlock = ["static/*"]
