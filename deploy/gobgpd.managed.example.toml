# Active-only managed deployment template. All peers start administratively down.
# Render operator-approved addresses into a LOCAL file; do not commit that file.
[global.config]
as = 64496
router-id = "192.0.2.10"
# Outbound connections only; no privileged BGP listener is needed.
port = -1
local-address-list = ["192.0.2.10"]
[global.apply-policy.config]
import-policy-list = ["HEMLOCK-DENY-ALL"]
export-policy-list = ["HEMLOCK-DENY-ALL"]
default-import-policy = "reject-route"
default-export-policy = "reject-route"
[[policy-definitions]]
name = "HEMLOCK-DENY-ALL"
[[policy-definitions.statements]]
[policy-definitions.statements.actions]
route-disposition = "reject-route"

[[neighbors]]
[neighbors.config]
neighbor-address = "192.0.2.1"
peer-as = 64496
description = "peer-one"
admin-down = true
[neighbors.transport.config]
local-address = "192.0.2.10"
remote-port = 179
passive-mode = false
[neighbors.timers.config]
hold-time = 180
keepalive-interval = 60
connect-retry = 10
# Requires the documented 4.10.0 iBGP TTL patch; upstream ignores this for iBGP.
[neighbors.ebgp-multihop.config]
enabled = true
multihop-ttl = 25
[neighbors.apply-policy.config]
import-policy-list = ["HEMLOCK-DENY-ALL"]
export-policy-list = ["HEMLOCK-DENY-ALL"]
default-import-policy = "reject-route"
default-export-policy = "reject-route"
[[neighbors.afi-safis]]
[neighbors.afi-safis.config]
afi-safi-name = "ipv4-unicast"
enabled = true
[[neighbors.afi-safis]]
[neighbors.afi-safis.config]
afi-safi-name = "ipv6-unicast"
enabled = true

[[neighbors]]
